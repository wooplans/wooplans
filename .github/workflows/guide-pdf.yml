name: Guide des maisons (PDF)

# Fabrique le « Guide WooPlans des maisons » à partir des modèles publiés sur wooplans.com,
# puis le dépose dans R2 (clé src/config/guide.json « pdfKey »), où /api/guide/<achat> le sert aux acheteurs.
# À relancer après chaque ajout de modèles. Procédure : docs/guide-des-maisons.md.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Déposer le PDF dans R2 (sinon : artefact à contrôler seulement)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: |
          sudo apt-get update -y && sudo apt-get install -y fonts-crosextra-carlito
          pip install reportlab pillow fonttools brotli
      - name: Modèles publiés et rendus
        run: python scripts/guide/fetch_plans.py
      - name: PDF
        run: python scripts/guide/build_guide.py --out guide-wooplans-des-maisons.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: guide-wooplans-des-maisons
          path: guide-wooplans-des-maisons.pdf
      - uses: actions/setup-node@v4
        if: inputs.publish
        with:
          node-version: 22
      - name: Dépôt dans R2
        if: inputs.publish
        run: |
          KEY=$(node -p "require('./src/config/guide.json').pdfKey")
          npx --yes wrangler@4 r2 object put "plans-catalogue-images/$KEY" --file guide-wooplans-des-maisons.pdf --content-type application/pdf --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
