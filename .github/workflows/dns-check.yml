name: Diagnostic (lecture seule)

on:
  push:
    branches: [ccr-03cfaad2-40szss]
    paths: [".github/workflows/dns-check.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    env:
      CF: https://api.cloudflare.com/client/v4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        shell: bash {0}
    steps:
      - name: Zone et enregistrements DNS de wooplans.com
        run: |
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "== Zone"
          curl -sS "${auth[@]}" "$CF/zones?name=wooplans.com" | jq '{success, errors, zones: [.result[]? | {id, status, account: (.account.id == env.CLOUDFLARE_ACCOUNT_ID), name_servers, plan: .plan.name}]}'
          zone=$(curl -sS "${auth[@]}" "$CF/zones?name=wooplans.com" | jq -r '.result[0].id // empty')
          if [ -n "$zone" ]; then
            echo "== DNS (apex et www)"
            curl -sS "${auth[@]}" "$CF/zones/$zone/dns_records?per_page=100" | jq '{success, errors, records: [.result[]? | select(.name=="wooplans.com" or .name=="www.wooplans.com") | {type, name, content, proxied}]}'
            echo "== Autres enregistrements (noms seulement)"
            curl -sS "${auth[@]}" "$CF/zones/$zone/dns_records?per_page=100" | jq -r '.result[]? | "\(.type) \(.name)"' | sort
          fi
          echo "== Domaines personnalisés des Workers"
          curl -sS "${auth[@]}" "$CF/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" | jq '{success, errors, domains: [.result[]? | {hostname, service}]}'
          echo "== Abonnement Workers du compte"
          curl -sS "${auth[@]}" "$CF/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/account-settings" | jq -c '{success, errors, result}'
          curl -sS "${auth[@]}" "$CF/accounts/$CLOUDFLARE_ACCOUNT_ID/subscriptions" | jq -c '{success, errors, subs: [.result[]? | {product: .rate_plan.id, state}]}'
          echo "== Requêtes successives sur www (une toutes les 0,5 s)"
          for i in $(seq 1 30); do
            for path in /catalogue/villa-v4-0$(( (i % 9) + 1 ))0 /media/upload-framer-77c915f1fb301a921d61.jpg /api/webhooks/chariow; do :; done
            code=$(curl -s -o /tmp/b.txt -w '%{http_code}' https://www.wooplans.com/catalogue/duplex-d4-01$(( i % 10 )))
            [ "$code" != "200" ] && { echo "$code $(grep -o -E 'Error [0-9]+|error code: [0-9]+|<title>[^<]*' /tmp/b.txt | head -2 | tr '\n' ' ')"; } || echo -n "."
            sleep 0.5
          done; echo
          echo "== Rafale (20 requêtes en parallèle)"
          for i in $(seq 1 20); do curl -s -o /tmp/p$i.txt -w '%{http_code}\n' https://www.wooplans.com/catalogue/villa-v4-00$(( (i % 9) + 1 )) & done; wait
          for i in $(seq 1 20); do grep -o -E 'error code: [0-9]+|Error [0-9]+' /tmp/p$i.txt | head -1; done | sort | uniq -c
          echo "== Résolution publique"
          dig +short www.wooplans.com; dig +short wooplans.com; dig +short NS wooplans.com
