# Retour arrière (demandé par le propriétaire le 14/10/2026 après des erreurs 1102) :
# www.wooplans.com et wooplans.com reviennent sur Framer en supprimant les routes du Worker.
# Les enregistrements DNS Framer n'ont jamais été modifiés.
name: Retour arrière vers Framer

on:
  push:
    branches: [ccr-03cfaad2-40szss]
    paths: [".github/workflows/rollback.yml"]

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    env:
      CF: https://api.cloudflare.com/client/v4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Supprimer les routes www.wooplans.com/* et wooplans.com/*
        run: |
          zone=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF/zones?name=wooplans.com" | jq -r '.result[0].id')
          for id in $(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF/zones/$zone/workers/routes" | jq -r '.result[] | select(.pattern == "www.wooplans.com/*" or .pattern == "wooplans.com/*") | .id'); do
            curl -sS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF/zones/$zone/workers/routes/$id" | jq -c '{success, errors}'
          done
          echo "Routes restantes :"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF/zones/$zone/workers/routes" | jq -c '[.result[] | .pattern]'
      - name: Vérification
        run: |
          sleep 20
          n=$(curl -s https://www.wooplans.com/sitemap.xml | grep -c "a-propos" || true)
          echo "Pages de la nouvelle plateforme dans le sitemap : $n (0 = Framer)"
          curl -s -o /dev/null -w '%{http_code} https://www.wooplans.com/\n' https://www.wooplans.com/
      - name: Erreurs récentes du Worker (lecture seule)
        continue-on-error: true
        run: |
          now=$(date +%s000); from=$(( now - 3*3600*1000 ))
          curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            "$CF/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
            --data "{\"queryId\":\"diag\",\"timeframe\":{\"from\":$from,\"to\":$now},\"view\":\"events\",\"limit\":40,\"parameters\":{\"filters\":[{\"key\":\"\$metadata.service\",\"operation\":\"eq\",\"type\":\"string\",\"value\":\"wooplans-web\"},{\"key\":\"\$workers.outcome\",\"operation\":\"neq\",\"type\":\"string\",\"value\":\"ok\"}]}}" \
            | jq -c '.success, .errors, (.result.events.events[]? | {url: .["$workers"].event.request.url, outcome: .["$workers"].outcome, cpu: .["$workers"].cpuTimeMs, wall: .["$workers"].wallTimeMs})'
