name: CI / Déploiement Cloudflare

on:
  push:
    branches: [master, main, ccr-03cfaad2-40szss]
    paths-ignore: ["scripts/framer/**", ".github/workflows/framer.yml", ".github/workflows/framer-import.yml", ".github/workflows/cutover.yml", ".github/workflows/dns-check.yml", ".github/workflows/rollback.yml"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx opennextjs-cloudflare build

  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ccr-03cfaad2-40szss'))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrations D1
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build et déploiement
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Secrets du Worker (depuis les secrets GitHub)
        run: |
          node -e '
            const names = ["AUTH_SECRET","CHARIOW_PULSE_SECRET","CHARIOW_API_KEY","RESEND_API_KEY","MCP_TOKEN","CRON_SECRET","WAJUB_SECRET_KEY","WAJUB_WEBHOOK_SECRET"];
            const out = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            require("fs").writeFileSync("/tmp/worker-secrets.json", JSON.stringify(out));
            console.log("Secrets transmis :", Object.keys(out).join(", ") || "aucun");
          '
          npx wrangler secret bulk /tmp/worker-secrets.json
          rm -f /tmp/worker-secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          CHARIOW_PULSE_SECRET: ${{ secrets.CHARIOW_PULSE_SECRET }}
          CHARIOW_API_KEY: ${{ secrets.CHARIOW_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WAJUB_SECRET_KEY: ${{ secrets.WAJUB_SECRET_KEY }}
          WAJUB_WEBHOOK_SECRET: ${{ secrets.WAJUB_WEBHOOK_SECRET }}

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: URL workers.dev, secrets du Worker, médias
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r .result.subdomain)
          echo "BASE_URL=https://wooplans-web.$sub.workers.dev" >> "$GITHUB_ENV"
          echo "URL : https://wooplans-web.$sub.workers.dev"
          echo "Secrets du Worker :"
          npx wrangler secret list --name wooplans-web --format json | jq -r '.[].name'
          npx wrangler d1 execute DB --remote --json --command "SELECT key, visibility FROM media" | jq '.[0].results' > /tmp/media.json
          echo "SMOKE_MEDIA=/tmp/media.json" >> "$GITHUB_ENV"
          jq -r 'group_by(.visibility) | map("\(.[0].visibility): \(length)") | .[]' /tmp/media.json
      - name: Tests de production (lecture seule)
        run: node scripts/smoke-prod.mjs
        env:
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          CHARIOW_PULSE_SECRET: ${{ secrets.CHARIOW_PULSE_SECRET }}
      - name: Tests de production sur www.wooplans.com (si le domaine pointe vers le Worker)
        run: |
          if curl -s https://www.wooplans.com/sitemap.xml | grep -q "/a-propos"; then
            BASE_URL=https://www.wooplans.com node scripts/smoke-prod.mjs
          else
            echo "www.wooplans.com est encore servi par Framer : tests ignorés."
          fi
        env:
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          CHARIOW_PULSE_SECRET: ${{ secrets.CHARIOW_PULSE_SECRET }}
      - name: Dépassements de ressources du Worker pendant les tests
        run: |
          sleep 30
          now=$(date +%s000); from=$(( now - 15*60*1000 ))
          curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
            --data "{\"queryId\":\"cpu\",\"timeframe\":{\"from\":$from,\"to\":$now},\"view\":\"events\",\"limit\":100,\"parameters\":{\"filters\":[{\"key\":\"\$metadata.service\",\"operation\":\"eq\",\"type\":\"string\",\"value\":\"wooplans-web\"},{\"key\":\"\$workers.outcome\",\"operation\":\"eq\",\"type\":\"string\",\"value\":\"exceededCpu\"}]}}" \
            > /tmp/cpu.json
          n=$(jq '[.result.events.events[]?] | length' /tmp/cpu.json)
          echo "Requêtes arrêtées pour dépassement CPU (15 dernières minutes) : $n"
          jq -c '.result.events.events[]? | {url: .["$workers"].event.request.url, cpu: .["$workers"].cpuTimeMs}' /tmp/cpu.json | head -10
          [ "$n" = "0" ]
      - name: Sitemap Framer (inventaire des URL à rediriger)
        if: always()
        run: |
          curl -fsSL https://www.wooplans.com/sitemap.xml -o /tmp/framer-sitemap.xml || true
          grep -o '<loc>[^<]*' /tmp/framer-sitemap.xml | sed 's/<loc>//' | sort -u | tee /tmp/framer-urls.txt
          echo "Total : $(wc -l < /tmp/framer-urls.txt)"
