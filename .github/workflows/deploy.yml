name: CI / Déploiement Cloudflare

on:
  push:
    branches: [master, main, ccr-03cfaad2-40szss]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx opennextjs-cloudflare build

  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ccr-03cfaad2-40szss'))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrations D1
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build et déploiement
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Secrets du Worker (depuis les secrets GitHub)
        run: |
          node -e '
            const names = ["AUTH_SECRET","CHARIOW_PULSE_SECRET","CHARIOW_API_KEY","RESEND_API_KEY","MCP_TOKEN","CRON_SECRET"];
            const out = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            require("fs").writeFileSync("/tmp/worker-secrets.json", JSON.stringify(out));
            console.log("Secrets transmis :", Object.keys(out).join(", ") || "aucun");
          '
          npx wrangler secret bulk /tmp/worker-secrets.json
          rm -f /tmp/worker-secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          CHARIOW_PULSE_SECRET: ${{ secrets.CHARIOW_PULSE_SECRET }}
          CHARIOW_API_KEY: ${{ secrets.CHARIOW_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
